<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neon Dash Engine</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="game">
    <!-- Player -->
    <div id="player"></div>

    <!-- Sample Obstacles -->
    <div class="spike" style="left:700px"></div>
    <div class="spike" style="left:1000px"></div>
    <div class="spike" style="left:1300px"></div>

    <!-- Portals to switch modes -->
    <div class="portal cube" style="left:1600px"></div>
    <div class="portal ship" style="left:1900px"></div>
    <div class="portal wave" style="left:2200px"></div>
    <div class="portal ball" style="left:2500px"></div>

    <!-- Decorations -->
    <div class="deco circle" style="left:500px; bottom:50px;"></div>
    <div class="deco star" style="left:1200px; bottom:100px;"></div>
    <div class="deco circle" style="left:2000px; bottom:80px;"></div>
</div>

<audio id="music" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_3f3f4a0e3e.mp3?filename=electronic-game-loop-110706.mp3" autoplay loop></audio>

<script src="script.js"></script>
</body>
</html>
